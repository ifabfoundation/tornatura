components:
  schemas:
    AccountTypeEnum:
      type: string
      enum:
      - Admin
      - Agronomist
      - Standard
      title: AccountTypeEnum
    AgriField:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        harvest:
          type: string
          title: Harvest
        area:
          type: number
          title: Area
        plants:
          type: integer
          title: Plants
        variety:
          type: string
          title: Variety
        rotation:
          type: string
          title: Rotation
        year:
          anyOf:
          - type: string
          - type: 'null'
          title: Year
        irrigation:
          type: string
          title: Irrigation
        grassing:
          type: string
          title: Grassing
        weaving:
          type: string
          title: Weaving
        map:
          items:
            $ref: '#/components/schemas/Point'
          type: array
          title: Map
        orgId:
          type: string
          title: Orgid
        creationTime:
          type: integer
          title: Creationtime
        lastUpdateTime:
          type: integer
          title: Lastupdatetime
      type: object
      required:
      - id
      - name
      - description
      - harvest
      - area
      - plants
      - variety
      - rotation
      - irrigation
      - grassing
      - weaving
      - map
      - orgId
      - creationTime
      - lastUpdateTime
      title: AgriField
    AgriFieldMutationPayload:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          maxLength: 500
          title: Description
          default: ''
        map:
          items:
            $ref: '#/components/schemas/Point'
          type: array
          title: Map
        harvest:
          type: string
          title: Harvest
        area:
          type: number
          title: Area
        plants:
          type: integer
          title: Plants
        variety:
          type: string
          title: Variety
        rotation:
          type: string
          title: Rotation
        year:
          anyOf:
          - type: string
          - type: 'null'
          title: Year
        irrigation:
          type: string
          title: Irrigation
        grassing:
          type: string
          title: Grassing
        weaving:
          type: string
          title: Weaving
      type: object
      required:
      - name
      - map
      - harvest
      - area
      - plants
      - variety
      - rotation
      - irrigation
      - grassing
      - weaving
      title: AgriFieldMutationPayload
    BbchGroup:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        icon:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon
        sortOrder:
          type: integer
          title: Sortorder
          default: 0
        stages:
          items:
            $ref: '#/components/schemas/BbchStage'
          type: array
          title: Stages
          default: []
      type: object
      required:
      - code
      - name
      title: BbchGroup
    BbchScale:
      properties:
        id:
          type: string
          title: Id
        harvestCode:
          type: string
          title: Harvestcode
        sourceHarvestCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceharvestcode
        groups:
          items:
            $ref: '#/components/schemas/BbchGroup'
          type: array
          title: Groups
          default: []
        creationTime:
          type: integer
          title: Creationtime
        lastUpdateTime:
          type: integer
          title: Lastupdatetime
      type: object
      required:
      - id
      - harvestCode
      - creationTime
      - lastUpdateTime
      title: BbchScale
    BbchScaleCreatePayload:
      properties:
        harvestCode:
          type: string
          title: Harvestcode
